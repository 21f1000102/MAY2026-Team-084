  /api/emergency/{cid}:
    put:
      tags:
        - Emergency
      summary: Update emergency contact
      description: Partially updates an emergency contact's name, service type, phone, and/or availability. ADMIN role only. **User Story — US-07**
      x-user-story: US-07
      security:
