openapi: 3.0.3
info:
  title: SocietyEase API
  description: API specification for the SocietyEase backend (Flask). Authentication uses JWT Bearer tokens. Each API endpoint is mapped to its corresponding user story using the x-user-story extension for traceability between the implementation and the project requirements.
  version: 4.0.0
servers:
  - url: http://localhost:5000
    description: Local development server
tags:
  - name: Auth
    description: Registration, login, and account/password management
  - name: Members
    description: Apartment and resident (member) management
  - name: Complaints
    description: Resident complaints and their status updates
  - name: Invoices
    description: Maintenance invoice generation and payment tracking
  - name: Expenses
    description: Society expense logging and income/expense summaries
  - name: Notices
    description: Announcements and notices published to residents
  - name: Polls
    description: Community polls and voting
  - name: Maintenance
    description: Scheduled maintenance task tracking
  - name: Equipment
    description: Society equipment inventory, servicing, and maintenance forecasting
  - name: Health
    description: Society Health Score calculation and history
  - name: Conflicts
    description: Anonymous neighbour conflict reporting and resolution
  - name: Parking
    description: Live visitor parking slot availability
  - name: Emergency
    description: Directory of emergency service contacts (plumbers, electricians, security, etc.)
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description:
        Creates a new user account (and returns a JWT access token immediately). Open endpoint — no authentication
        required. `role` must be one of the eight defined roles. **User Story — US-08**
      x-user-story: US-08
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully; JWT token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: A required field (name, email, password, role) is missing, or role is not one of the valid roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A user with this email is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Log in
      description:
        Authenticates a user with email and password and returns a JWT access token. Open endpoint — no authentication
        required. **User Story — US-08**
      x-user-story: US-08
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful; JWT token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: email or password missing from the request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Email/password combination is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The account is deactivated and may not log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Get current user profile
      description: Returns the profile of the currently authenticated user, resolved from the JWT identity. **User Story — US-08**
      x-user-story: US-08
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The user referenced by the JWT no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/change-password:
    put:
      tags:
        - Auth
      summary: Change password
      description: Changes the authenticated user's password after verifying the supplied old password. **User Story — US-08**
      x-user-story: US-08
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
              required:
                - old_password
                - new_password
      responses:
        "200":
          description: Password changed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: old_password does not match the account's current password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/members/apartments:
    get:
      tags:
        - Members
      summary: List apartments
      description: Returns every apartment/flat registered in the society. **User Story — US-09**
      x-user-story: US-09
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of apartments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Apartment"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Members
      summary: Add apartment
      description: Registers a new apartment/flat. `flat_number` must be unique across the society. **User Story — US-09**
      x-user-story: US-09
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flat_number:
                  type: string
                block:
                  type: string
                floor:
                  type: integer
              required:
                - flat_number
      responses:
        "201":
          description: Apartment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Apartment"
        "400":
          description: flat_number is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An apartment with this flat_number already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/members/apartments/{apt_id}:
    put:
      tags:
        - Members
      summary: Update apartment
      description: Updates the block and/or floor of an existing apartment. **User Story — US-09**
      x-user-story: US-09
      security:
        - bearerAuth: []
      parameters:
        - name: apt_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                block:
                  type: string
                floor:
                  type: integer
      responses:
        "200":
          description: Apartment updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Apartment"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No apartment with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Members
      summary: Delete apartment
      description:
        Deletes an apartment and (via cascade) its residents, invoices, and complaints. This is destructive and
        irreversible. **User Story — US-09**
      x-user-story: US-09
      security:
        - bearerAuth: []
      parameters:
        - name: apt_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Apartment deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No apartment with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/members:
    get:
      tags:
        - Members
      summary: List members
      description:
        Returns every resident (with their linked user account and flat details). Visible to any authenticated
        user. **User Story — US-09**
      x-user-story: US-09
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resident"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Members
      summary: Add member
      description:
        Creates a new user account and links it to an apartment as a resident, in one call. Intended for association-manager
        use. **User Story — US-09**
      x-user-story: US-09
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  type: string
                apartment_id:
                  type: integer
                phone:
                  type: string
                is_owner:
                  type: boolean
                move_in_date:
                  type: string
              required:
                - name
                - email
                - password
                - role
                - apartment_id
      responses:
        "201":
          description: Member (user + resident record) created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
        "400":
          description: A required field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: apartment_id does not match an existing apartment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A user with this email is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/members/{resident_id}:
    get:
      tags:
        - Members
      summary: Get member detail
      description: Returns a single resident's profile and flat details. **User Story — US-09**
      x-user-story: US-09
      security:
        - bearerAuth: []
      parameters:
        - name: resident_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No resident with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Members
      summary: Update member
      description: Updates a resident's name, phone, ownership flag, and move-in/move-out dates. **User Story — US-09**
      x-user-story: US-09
      security:
        - bearerAuth: []
      parameters:
        - name: resident_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                is_owner:
                  type: boolean
                move_in_date:
                  type: string
                move_out_date:
                  type: string
      responses:
        "200":
          description: Member updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No resident with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Members
      summary: Deactivate member
      description:
        Soft-deletes a member by setting the linked user account's is_active flag to false. The resident record
        itself is not deleted. **User Story — US-09**
      x-user-story: US-09
      security:
        - bearerAuth: []
      parameters:
        - name: resident_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member deactivated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No resident with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/complaints:
    get:
      tags:
        - Complaints
      summary: List complaints
      description:
        ADMIN, TREASURER, and COMMITTEE_MEMBER roles see every complaint; all other roles see only the complaints
        they personally raised. **User Story — US-03**
      x-user-story: US-03
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Complaints list, most recent first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Complaint"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Complaints
      summary: Raise complaint
      description: Raises a new maintenance/society complaint against an apartment. **User Story — US-02**
      x-user-story: US-02
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintCreateRequest"
      responses:
        "201":
          description: Complaint created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "400":
          description: title, category, or apartment_id is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/complaints/{cid}:
    get:
      tags:
        - Complaints
      summary: Get complaint detail
      description: Returns full complaint details, including its status-update history (who changed what, and when). **User Story — US-03**
      x-user-story: US-03
      security:
        - bearerAuth: []
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Complaint detail, including its status update history.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Complaint"
                  - type: object
                    properties:
                      updates:
                        type: array
                        items:
                          $ref: "#/components/schemas/ComplaintUpdate"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No complaint with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - Complaints
      summary: Delete complaint
      description: Permanently deletes a complaint and its update history. **User Story — US-03**
      x-user-story: US-03
      security:
        - bearerAuth: []
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Complaint deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No complaint with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/complaints/{cid}/assign:
    put:
      tags:
        - Complaints
      summary: Assign worker to complaint
      description:
        Assigns a maintenance worker to a complaint and moves its status to ASSIGNED, logging the change in the
        complaint's update history. **User Story — US-04**
      x-user-story: US-04
      security:
        - bearerAuth: []
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                worker_id:
                  type: integer
                remarks:
                  type: string
      responses:
        "200":
          description: Complaint assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No complaint with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/complaints/{cid}/status:
    put:
      tags:
        - Complaints
      summary: Update complaint status
      description:
        Updates a complaint's status (OPEN, ASSIGNED, IN_PROGRESS, COMPLETED, or CLOSED) and logs the change. Sets
        resolved_at automatically when moved to COMPLETED or CLOSED. **User Story — US-03**
      x-user-story: US-03
      security:
        - bearerAuth: []
      parameters:
        - name: cid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - OPEN
                    - ASSIGNED
                    - IN_PROGRESS
                    - COMPLETED
                    - CLOSED
                remarks:
                  type: string
              required:
                - status
      responses:
        "200":
          description: Complaint status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "400":
          description: status is missing or is not one of the valid statuses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No complaint with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/invoices:
    get:
      tags:
        - Invoices
      summary: List invoices
      description: ADMIN and TREASURER roles see every invoice; all other roles see only invoices for their own apartment. **User Story — US-05, US-06**
      x-user-story: US-05, US-06
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invoices list, most recent first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Invoices
      summary: Create invoice
      description: Generates a single maintenance invoice for one apartment for a given month/year. **User Story — US-01**
      x-user-story: US-01
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreateRequest"
      responses:
        "201":
          description: Invoice created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: apartment_id, month, year, or amount is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/invoices/bulk:
    post:
      tags:
        - Invoices
      summary: Bulk-generate invoices
      description:
        Generates an invoice of the given amount for every apartment in the society for the given month/year, in
