                type: string
                nullable: true
        totals:
          type: object
          properties:
            complaints:
              type: integer
            maintenance:
              type: integer
            total:
              type: integer
    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        event_type:
          type: string
          enum:
          - MEETING
          - EVENT
          - HOLIDAY
          - DEADLINE
          - OTHER
        event_date:
          type: string
        event_time:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        created_by:
          type: integer
        created_at:
          type: string
    EventCreateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        event_type:
          type: string
          enum:
          - MEETING
          - EVENT
          - HOLIDAY
          - DEADLINE
          - OTHER
        event_date:
          type: string
        event_time:
          type: string
        location:
          type: string
      required:
      - title
      - event_date
    UpcomingItem:
      type: object
      description: One entry in the merged /api/events/upcoming feed, merged from manual events, unpaid invoices, active polls, maintenance tasks and equipment service dates.
      properties:
        type:
          type: string
          description: 'The event type/category, e.g. MEETING, DEADLINE, MAINTENANCE.'
        title:
