      - service_type
      - phone
    ComplaintSummary:
      type: object
      description: Counts and breakdowns over the same role-scoped, optionally filtered set of complaints as GET /api/complaints/.
      properties:
        total:
          type: integer
        by_status:
          type: object
          description: Count per status (OPEN, ASSIGNED, IN_PROGRESS, COMPLETED, CLOSED).
        pending:
          type: integer
          description: Sum of OPEN + ASSIGNED + IN_PROGRESS.
        resolved:
          type: integer
          description: Sum of COMPLETED + CLOSED.
        by_category:
          type: object
        by_priority:
          type: object
        avg_resolution_days:
          type: number
          nullable: true
          description: Average days between created_at and resolved_at, across resolved complaints in scope. Null if none are resolved.
        unassigned_count:
          type: integer
    InvoiceSummary:
      type: object
      description: Totals and a monthly breakdown over the same role-scoped, optionally filtered set of invoices as GET /api/invoices/. The overdue sweep runs first, so counts are always current.
      properties:
        total_invoiced:
          type: number
        total_collected:
          type: number
        total_pending:
          type: number
        count_paid:
          type: integer
        count_unpaid:
          type: integer
        count_overdue:
          type: integer
        overdue_amount:
          type: number
        collection_rate:
          type: number
          description: total_collected / total_invoiced * 100, rounded to 2 decimals. 0 if nothing is invoiced.
        by_month:
          type: object
          description: 'Keyed by "YYYY-MM", each value an object with `invoiced` and `collected` totals.'
    MaintenanceSummary:
      type: object
      description: Counts over the same role-scoped, optionally filtered set of tasks as GET /api/maintenance/.
      properties:
        total:
          type: integer
        by_status:
          type: object
          description: Count per status (PENDING, IN_PROGRESS, COMPLETED).
        by_category:
          type: object
        overdue_count:
          type: integer
