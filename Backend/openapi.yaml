# SocietyEase API — OpenAPI 3.0.3
# Single source of truth for the REST API. Generated from the team spec and
# reconciled against the Flask source, so every declared status code is one the
# code can actually return.
openapi: 3.0.3
info:
  title: SocietyEase API
  description: |
    API specification for the SocietyEase backend (Flask). Authentication uses JWT Bearer tokens. Each API endpoint is mapped to its corresponding user story using the x-user-story extension for traceability between the implementation and the project requirements.

    ## User story mapping

    Every operation carries an `x-user-story` extension. The stories are:

    | ID | User story |
    |---|---|
    | **US-01** | As a **Treasurer**, I want to generate and track maintenance invoices for every flat, so that dues are billed consistently and I can see what is outstanding. |
    | **US-02** | As a **Resident**, I want to raise a complaint about a problem in my flat or the building, so that the society has a record of it and someone is accountable for fixing it. |
    | **US-03** | As a **Resident**, I want to track the status of my complaint from open to closed, so that I know whether it is being worked on without having to chase anyone. |
    | **US-04** | As a **Association manager**, I want to assign a complaint to a maintenance worker, so that the right person is responsible and the job reaches their queue. |
    | **US-05** | As a **Owner**, I want to see the invoices raised against the flat I own, so that I can keep track of what my tenant or I owe the society. |
    | **US-06** | As a **Resident**, I want to view my invoices and download a receipt once paid, so that I have proof of payment for my records. |
    | **US-07** | As a **Tenant**, I want to access emergency contact numbers for plumbers, electricians and security staff in one place, so that I can quickly reach them during emergencies. |
    | **US-08** | As a **User**, I want to register, log in and manage my own account and password, so that my access to the portal is secure and under my control. |
    | **US-09** | As a **Association manager**, I want to manage flats and the residents living in them, so that the society register stays accurate as people move in and out. |
    | **US-10** | As a **Resident**, I want to read notices published by the association, so that I do not miss announcements about water, maintenance or emergencies. |
    | **US-11** | As a **Association manager**, I want to schedule and track recurring maintenance tasks, so that routine upkeep happens on time and nothing is forgotten. |
    | **US-12** | As a **Resident**, I want to see live visitor-parking availability and reserve a slot, so that my guests know where to park without blocking anyone. |
    | **US-13** | As a **Resident**, I want to vote in society polls and see the results, so that I have a say in decisions that affect the community. |
    | **US-14** | As a **Treasurer**, I want to record society expenses and view a monthly income-versus-expense summary, so that the committee can see where the society's money goes. |
    | **US-15** | As a **Association manager**, I want to track equipment servicing and get a 30-day maintenance forecast, so that I can budget for and schedule servicing before something fails. |
    | **US-16** | As a **Resident**, I want to report a conflict with a neighbour anonymously and let the secretary mediate, so that the issue is resolved without a direct confrontation. |
    | **US-17** | As a **Committee member**, I want to see a monthly society health score across payments, complaints, notices, polls and maintenance, so that we can spot problems early and track whether things are improving. |
    | **US-18** | As a **Association manager**, I want to search and filter members, complaints, invoices, expenses and maintenance tasks by common criteria, so that I can find a specific record quickly without scanning the whole list. |
    | **US-19** | As a **Treasurer**, I want summary reports and exportable data for complaints and payments, so that I can review society performance without manually counting records. |
    | **US-20** | As a **Resident**, I want to see upcoming rent due dates, society meetings and other deadlines in one place, so that I do not miss them. |
    | **US-21** | As a **Maintenance worker**, I want a dashboard scoped to my own assigned complaints and tasks, with the ability to complete them and see my work history, so that I can do my job without seeing data that is not mine. |

    The same table is maintained in `docs/USER_STORIES.md`.
  version: 4.1.0
servers:
- url: http://localhost:5000
  description: Local development server
tags:
- name: Auth
  description: Registration, login, and account/password management
- name: Members
  description: Apartment and resident (member) management
- name: Complaints
  description: Resident complaints and their status updates
- name: Invoices
  description: Maintenance invoice generation and payment tracking
- name: Expenses
  description: Society expense logging and income/expense summaries
- name: Notices
  description: Announcements and notices published to residents
- name: Polls
  description: Community polls and voting
- name: Maintenance
  description: Scheduled maintenance task tracking
- name: Equipment
  description: Society equipment inventory, servicing, and maintenance forecasting
- name: Health
  description: Society Health Score calculation and history
- name: Conflicts
  description: Anonymous neighbour conflict reporting and resolution
- name: Parking
  description: Live visitor parking slot availability
- name: Emergency
  description: Directory of emergency service contacts (plumbers, electricians, security, etc.)
- name: Events
  description: Society meetings/events and the merged upcoming-deadlines feed
paths:
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Register a new user
      description: |-
        Creates a new user account (and returns a JWT access token immediately). Open endpoint — no authentication required. `role` must be one of the eight defined roles. **User Story — US-08**

        Access: public — no authentication required.
      x-user-story: US-08
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        description: JSON object. Unknown fields are ignored; blank optional values are stored as null.
      responses:
        '201':
          description: User registered successfully; JWT token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: A required field (name, email, password, role) is missing, or role is not one of
            the valid roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A user with this email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: auth_register
      x-required-role: public — no authentication required
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Log in
      description: |-
        Authenticates a user with email and password and returns a JWT access token. Open endpoint — no authentication required. **User Story — US-08**

        Access: public — no authentication required.
      x-user-story: US-08
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        description: JSON object. Unknown fields are ignored; blank optional values are stored as null.
      responses:
        '200':
          description: Login successful; JWT token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: email or password missing from the request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Email/password combination is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account is deactivated and may not log in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: auth_login
      x-required-role: public — no authentication required
  /api/auth/me:
    get:
      tags:
      - Auth
      summary: Get current user profile
      description: |-
        Returns the profile of the currently authenticated user, resolved from the JWT identity. **User Story — US-08**

        Access: any authenticated, active user.
      x-user-story: US-08
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The user referenced by the JWT no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: auth_me
      x-required-role: any authenticated, active user
  /api/auth/change-password:
    put:
      tags:
      - Auth
      summary: Change password
      description: |-
        Changes the authenticated user's password after verifying the supplied old password. **User Story — US-08**

        Access: any authenticated, active user.
      x-user-story: US-08
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
              required:
              - old_password
              - new_password
        description: JSON object. Unknown fields are ignored; blank optional values are stored as null.
      responses:
        '200':
          description: Password changed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: old_password does not match the account's current password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: auth_change_password
      x-required-role: any authenticated, active user
  /api/members/apartments:
    get:
      tags:
      - Members
      summary: List apartments
      description: |-
        Returns every apartment/flat registered in the society. **User Story — US-09**

        Access: any authenticated, active user.
      x-user-story: US-09
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of apartments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Apartment'
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: members_get_apartments
      x-required-role: any authenticated, active user
    post:
      tags:
      - Members
      summary: Add apartment
      description: |-
        Registers a new apartment/flat. `flat_number` must be unique across the society. **User Story — US-09**

        Access: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER.
      x-user-story: US-09
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flat_number:
                  type: string
                block:
                  type: string
                floor:
                  type: integer
              required:
              - flat_number
        description: JSON object. Unknown fields are ignored; blank optional values are stored as null.
      responses:
        '201':
          description: Apartment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
        '400':
          description: flat_number is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: An apartment with this flat_number already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: members_add_apartment
      x-required-role: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER
  /api/members/apartments/{apt_id}:
    put:
      tags:
      - Members
      summary: Update apartment
      description: |-
        Updates the block and/or floor of an existing apartment. **User Story — US-09**

        Access: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER.
      x-user-story: US-09
      security:
      - bearerAuth: []
      parameters:
      - name: apt_id
        in: path
        required: true
        schema:
          type: integer
        description: Apartment (flat) id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                block:
                  type: string
                floor:
                  type: integer
        description: JSON object. Unknown fields are ignored; blank optional values are stored as null.
      responses:
        '200':
          description: Apartment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No apartment with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: members_update_apartment
      x-required-role: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER
    delete:
      tags:
      - Members
      summary: Delete apartment
      description: |-
        Removes a flat. **Refused with 409 if the flat still has residents or invoices**, so deleting a flat can never silently destroy its residents, invoices, payments or complaints. Detach or remove those records first. **User Story — US-09**

        Access: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER.
      x-user-story: US-09
      security:
      - bearerAuth: []
      parameters:
      - name: apt_id
        in: path
        required: true
        schema:
          type: integer
        description: Apartment (flat) id.
      responses:
        '200':
          description: Apartment deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No apartment with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: members_delete_apartment
      x-required-role: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER
  /api/members/:
    get:
      tags:
      - Members
      summary: List members
      description: |-
        Lists every resident with their flat, role and contact details, optionally narrowed by any combination of the query filters below. **Admin-only** (ADMIN, SYSTEM_ADMIN, TREASURER, COMMITTEE_MEMBER) — this is society-wide personal data. **User Story — US-09, US-18**

        Access: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER.
      x-user-story:
      - US-09
      - US-18
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Free-text search across name, email, phone and flat number.
      - name: role
        in: query
        schema:
          type: string
        description: Exact role match, e.g. TENANT, OWNER, WORKER.
      - name: is_owner
        in: query
        schema:
          type: boolean
        description: 'true = owners only, false = tenants only.'
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: apartment_id
        in: query
        schema:
          type: integer
      - name: block
        in: query
        schema:
          type: string
      - name: floor
        in: query
        schema:
          type: integer
      - name: has_parking
        in: query
        schema:
          type: boolean
        description: Whether the member's flat currently has an occupied or reserved parking slot.
      responses:
        '200':
          description: List of members, optionally filtered.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: members_get_members
      x-required-role: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER
    post:
      tags:
      - Members
      summary: Add member
      description: |-
        Creates a new user account and links it to an apartment as a resident, in one call. Intended for association-manager use. **User Story — US-09**

        Access: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER.
      x-user-story: US-09
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  type: string
                apartment_id:
                  type: integer
                phone:
                  type: string
                is_owner:
                  type: boolean
                move_in_date:
                  type: string
              required:
              - name
              - email
              - password
              - role
              - apartment_id
        description: JSON object. Unknown fields are ignored; blank optional values are stored as null.
      responses:
        '201':
          description: Member (user + resident record) created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resident'
        '400':
          description: A required field is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: apartment_id does not match an existing apartment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A user with this email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: members_add_member
      x-required-role: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER
  /api/members/export:
    get:
      tags:
      - Members
      summary: Export members as CSV
      description: |-
        Same role scoping and query filters as GET /api/members/, returned as a downloadable CSV instead of JSON. **User Story — US-19**

        Access: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER.
      x-user-story: US-19
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: role
        in: query
        schema:
          type: string
      - name: is_owner
        in: query
        schema:
          type: boolean
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: apartment_id
        in: query
        schema:
          type: integer
      - name: block
        in: query
        schema:
          type: string
      - name: floor
        in: query
        schema:
          type: integer
      - name: has_parking
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: CSV file of the filtered member list.
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: members_export_members
      x-required-role: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER
  /api/members/{resident_id}:
    get:
      tags:
      - Members
      summary: Get member detail
      description: |-
        Returns a single resident's profile and flat details. **User Story — US-09**

        Access: any authenticated, active user.
      x-user-story: US-09
      security:
      - bearerAuth: []
      parameters:
      - name: resident_id
        in: path
        required: true
        schema:
          type: integer
        description: Resident record id — **not** the users.id.
      responses:
        '200':
          description: Member detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resident'
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No resident with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: members_get_member
      x-required-role: any authenticated, active user
    put:
      tags:
      - Members
      summary: Update member
      description: |-
        Updates a resident's name, phone, ownership flag, and move-in/move-out dates. **User Story — US-09**

        Access: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER.
      x-user-story: US-09
      security:
      - bearerAuth: []
      parameters:
      - name: resident_id
        in: path
        required: true
        schema:
          type: integer
        description: Resident record id — **not** the users.id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                is_owner:
                  type: boolean
                move_in_date:
                  type: string
                move_out_date:
                  type: string
        description: JSON object. Unknown fields are ignored; blank optional values are stored as null.
      responses:
        '200':
          description: Member updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No resident with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: members_update_member
