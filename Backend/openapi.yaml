          - low
        source:
          type: string
          enum:
          - event
          - invoice
          - poll
          - maintenance
          - equipment
        link:
          type: string
          description: Frontend route this item corresponds to.
  responses:
    BadRequest:
      description: Validation failed — a required field is missing, or a value has the wrong type/format
        (bad date, non-numeric amount, unknown enum value, or a body that is not a JSON object).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: 'category must be one of: PLUMBING, ELECTRICAL, CLEANING, SECURITY, OTHER'
    Unauthorized:
      description: 'No JWT was supplied, or it is invalid or malformed. Note: flask-jwt-extended emits
        these under a `msg` key rather than `error`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            msg: Missing Authorization Header
    Forbidden:
      description: 'The caller is authenticated but not allowed: either the account has been deactivated,
        or the user''s role is not permitted to perform this action, or the resource belongs to another
        resident.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: You are not allowed to perform this action
    NotFound:
      description: The requested resource does not exist. Also returned when the JWT is valid but the
        user it identifies has been removed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Not found
    Conflict:
      description: The request conflicts with existing data — a duplicate unique value, or a business
        rule such as paying an already-paid invoice.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: This invoice is already paid
    ServerError:
      description: Unexpected server error. All errors are returned as JSON; the API never returns an
        HTML error page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Internal server error
