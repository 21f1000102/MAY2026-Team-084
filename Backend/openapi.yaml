      responses:
        '200':
          description: The list of active maintenance workers.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: users.id — use as worker_id
                    name:
                      type: string
                    email:
                      type: string
                      format: email
              example:
              - id: 6
                name: Ramesh Worker
                email: worker@apt.com
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: members_get_workers
