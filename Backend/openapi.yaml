  /api/events/:
    get:
      tags:
      - Events
      summary: List events
      description: |-
        Lists active society events/meetings, soonest first, optionally filtered. **User Story — US-20**

        Access: any authenticated, active user.
      x-user-story: US-20
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: Free-text search over title.
      - name: event_type
        in: query
        schema:
          type: string
          enum:
          - MEETING
          - EVENT
          - HOLIDAY
          - DEADLINE
          - OTHER
      - name: from
        in: query
        schema:
          type: string
        description: Inclusive lower bound on event_date (YYYY-MM-DD).
      - name: to
        in: query
        schema:
          type: string
        description: Inclusive upper bound on event_date (YYYY-MM-DD).
      responses:
        '200':
          description: Active events, soonest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: events_get_events
      x-required-role: any authenticated, active user
    post:
      tags:
      - Events
      summary: Create event
      description: |-
        Creates a society event/meeting. **User Story — US-20**

        Access: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER.
      x-user-story: US-20
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
        description: JSON object. Unknown fields are ignored; blank optional values are stored as null.
      responses:
        '201':
          description: Event created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: title or event_date is missing, or event_type is not a valid enum value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: events_add_event
      x-required-role: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER
  /api/events/{eid}:
    put:
      tags:
      - Events
      summary: Update event
      description: |-
        Updates a society event/meeting. Only supplied fields are changed. **User Story — US-20**

        Access: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER.
      x-user-story: US-20
      security:
      - bearerAuth: []
      parameters:
      - name: eid
        in: path
        required: true
        schema:
          type: integer
        description: Identifier of the target record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '200':
          description: Event updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No event with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: events_update_event
      x-required-role: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER
    delete:
      tags:
      - Events
      summary: Delete event
      description: |-
        Soft-deletes an event (sets is_active=false), the same pattern used by Announcements. **User Story — US-20**

        Access: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER.
      x-user-story: US-20
      security:
      - bearerAuth: []
      parameters:
      - name: eid
        in: path
        required: true
        schema:
          type: integer
        description: Identifier of the target record.
      responses:
        '200':
          description: Event deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No event with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: events_delete_event
      x-required-role: ADMIN, SYSTEM_ADMIN, TREASURER or COMMITTEE_MEMBER
  /api/events/upcoming:
    get:
      tags:
      - Events
      summary: Merged upcoming-deadlines feed
      description: |-
        A single chronologically sorted, role-aware feed merging manual events, the caller's own unpaid invoices (or every flat's for an admin), active polls, maintenance tasks (admin and the assigned worker), and equipment service dates (admin only). Calendar (.ics) export is not implemented — this is an in-app feed only. **User Story — US-20**

        Access: any authenticated, active user.
      x-user-story: US-20
      security:
      - bearerAuth: []
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          default: 30
        description: How many days ahead to include. 1-365.
      responses:
        '200':
          description: Upcoming items, soonest (or most overdue) first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpcomingItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: events_upcoming
      x-required-role: any authenticated, active user
components:
  securitySchemes:
    bearerAuth:
