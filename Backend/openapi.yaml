          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
        is_active:
          type: boolean
        apartment_id:
          type: integer
        flat_number:
          type: string
        block:
          type: string
          nullable: true
        floor:
          type: integer
